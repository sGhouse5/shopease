# Used on the Azure VM (SPRING_PROFILES_ACTIVE=prod is set by the systemd unit).
# A file-based H2 database keeps the demo free of extra servers.
# Swap this URL for MySQL/PostgreSQL later (see docs/adr/0003-h2-file-database.md).
spring.datasource.url=jdbc:h2:file:${SHOPEASE_DATA_DIR:./data}/shopease
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
